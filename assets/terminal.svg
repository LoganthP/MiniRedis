<svg xmlns="http://www.w3.org/2000/svg" width="900" height="396" viewBox="0 0 900 396" role="img" aria-label="Animated redis-cli session showing a key and its TTL surviving a kill -9">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient></defs>
<rect width="900" height="396" rx="14" fill="url(#g)" stroke="#30363d"/>
<rect width="900" height="44" rx="14" fill="#161b22"/><rect y="30" width="900" height="14" fill="#161b22"/>
<circle cx="26" cy="22" r="7" fill="#ff5f56"/><circle cx="50" cy="22" r="7" fill="#ffbd2e"/><circle cx="74" cy="22" r="7" fill="#27c93f"/>
<text x="450" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">miniredis ~ crash-safe demo</text>
<text x="28" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" opacity="0" xml:space="preserve">$ redis-cli -p 6380 SET greeting &quot;hello&quot; EX 120<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0375;0.0475;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#34d399" opacity="0" xml:space="preserve">OK<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1000;0.1100;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" opacity="0" xml:space="preserve">$ redis-cli -p 6380 TTL greeting<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1625;0.1725;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#fbbf24" opacity="0" xml:space="preserve">(integer) 118<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2250;0.2350;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" opacity="0" xml:space="preserve">$ kill -9 $(pgrep -f miniredis.server)   # hard crash<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3125;0.3225;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#fb7185" opacity="0" xml:space="preserve">supervisor: server restarted in ~1 ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3875;0.3975;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#fb7185" opacity="0" xml:space="preserve">recovery: snapshot loaded, log replayed, state = ready<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4625;0.4725;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" opacity="0" xml:space="preserve">$ redis-cli -p 6380 GET greeting<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5625;0.5725;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#fbbf24" opacity="0" xml:space="preserve">&quot;hello&quot;<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6250;0.6350;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" opacity="0" xml:space="preserve">$ redis-cli -p 6380 TTL greeting<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6875;0.6975;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="28" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#fbbf24" opacity="0" xml:space="preserve">(integer) 107   # deadline survived the crash<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7500;0.7600;0.9500;1" dur="16.0s" repeatCount="indefinite"/></text>
<rect x="28" y="370" width="9" height="17" fill="#dc2626"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>