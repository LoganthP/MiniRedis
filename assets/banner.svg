<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="MiniRedis banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.6" stop-color="#1a0b12"/>
      <stop offset="1" stop-color="#3b0a14"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="beat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .beat { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 3.2s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1100; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1100; } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
      .fadein { opacity: 0; animation: fadein 1.2s ease-out .3s forwards; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 70H1000M0 140H1000M0 210H1000"/>
    <path d="M125 0V280M250 0V280M375 0V280M500 0V280M625 0V280M750 0V280M875 0V280"/>
  </g>

  <!-- floating key/value chips -->
  <g class="mono" font-size="13">
    <g class="float" style="animation-delay:0s">
      <rect x="690" y="34" width="150" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="704" y="54" fill="#fbbf24">SET</text><text x="740" y="54" fill="#e6edf3">user:42 EX 60</text>
    </g>
    <g class="float" style="animation-delay:1.2s">
      <rect x="800" y="86" width="150" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="814" y="106" fill="#34d399">GET</text><text x="850" y="106" fill="#e6edf3">cart:7f3a</text>
    </g>
    <g class="float" style="animation-delay:2.4s">
      <rect x="650" y="138" width="130" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="664" y="158" fill="#fb7185">TTL</text><text x="700" y="158" fill="#e6edf3">sess:9</text>
    </g>
  </g>

  <!-- title -->
  <g class="fadein">
    <text x="60" y="118" class="sans" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">MiniRedis</text>
    <text x="62" y="156" class="mono" font-size="19" fill="#fda4af">Build your own Redis. Persistent. Crash-safe. Observable.</text>
    <text x="62" y="186" class="mono" font-size="14" fill="#8b949e">asyncio · RESP2 · AOF + CRC32 · snapshots · FastAPI · React</text>
  </g>

  <!-- heartbeat line (durability) -->
  <path class="beat" filter="url(#glow)" fill="none" stroke="url(#beat)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M0 235 L220 235 L250 235 L275 200 L300 262 L330 176 L360 235 L560 235 L590 235 L615 205 L640 255 L668 190 L695 235 L1000 235"/>

  <!-- status dots -->
  <g>
    <circle class="pulse" cx="62" cy="40" r="5" fill="#34d399"/>
    <text x="76" y="45" class="mono" font-size="13" fill="#a7f3d0">status: ready</text>
    <circle class="pulse" cx="200" cy="40" r="5" fill="#dc2626" style="animation-delay:.8s"/>
    <text x="214" y="45" class="mono" font-size="13" fill="#fecaca">fsync before OK</text>
  </g>
</svg>
