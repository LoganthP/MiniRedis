# Netlify hosts only the React frontend. The backend (database + API) runs on a
# host that keeps processes and a disk — see README › "Frontend on Netlify,
# backend elsewhere". Set MINIREDIS_API_URL in Netlify → Site configuration →
# Environment variables (e.g. https://miniredis-backend.onrender.com) and
# redeploy: the build then proxies this site's /api/* to the backend.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
