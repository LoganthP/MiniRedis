# Render Blueprint for the backend (database + API in one container).
# New → Blueprint → pick this repo. DASHBOARD_PASSWORD below is a demo default:
# change it (here or in the Render dashboard → Environment) for anything public.
services:
  - type: web
    name: miniredis-backend
    runtime: docker
    dockerfilePath: ./deploy/backend/Dockerfile
    dockerContext: .
    plan: starter            # a persistent disk needs a paid plan; see README
    healthCheckPath: /api/health
    numInstances: 1          # one database = one instance; never scale this out
    envVars:
      - key: DASHBOARD_PASSWORD
        value: change-me     # demo default; override in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_CRASH_DEMO
        value: "true"
      - key: ALLOW_DEMO_WORKLOAD
        value: "true"
      - key: PUBLIC_READS
        value: "false"
    disk:
      name: miniredis-data
      mountPath: /data
      sizeGB: 1
