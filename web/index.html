<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Apply the saved theme before first paint (light by default) to avoid a flash.
      try { document.documentElement.dataset.theme = localStorage.getItem("miniredis.theme") === "dark" ? "dark" : "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MiniRedis · Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
